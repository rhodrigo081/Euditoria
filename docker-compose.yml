services:
  euditoria-backend:
    build:
      context: ./src/app
      dockerfile: Dockerfile
    container_name: euditoria-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=${EUDITORIA_PORT:-8080}
      - EUDITORIA_RATELIMIT_ENABLED=${EUDITORIA_RATE_LIMIT_ENABLED}
      - EUDITORIA_CONFIDENTIALITY_STRICT=${EUDITORIA_CONFIDENTIALITY_STRICT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${SUPABASE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${SUPABASE_DB_PASSWORD}
    networks:
      - euditoria-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  euditoria-frontend:
    build:
      context: ./src/public
      dockerfile: Dockerfile
    container_name: euditoria-frontend
    ports:
      - "3000:3000"
    depends_on:
      euditoria-backend:
        condition: service_healthy
    networks:
      - euditoria-network
    restart: unless-stopped

networks:
  euditoria-network:
    driver: bridge