server:
  # O Spring lerá a porta $PORT injetada pela Vercel, usando 8080 caso esteja local
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod} # Assume 'prod' por padrão na Vercel
  application:
    name: euditoria-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

euditoria:
  cors:
    allowed-origins: ${EUDITORIA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    confidentiality-strict: true
    expose-internal-traces: false
  ratelimit:
    enabled: ${EUDITORIA_RATE_LIMIT_ENABLED:true}
    default-requests-per-minute: 120
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 100
    thread-name-prefix: "EuditoriaAsync-"

---
# ==========================================
# Profile: PROD (Vercel + Supabase)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  
  # Acelera drasticamente a inicialização do Spring Boot Serverless
  main:
    lazy-initialization: true

  datasource:
    # Formatação com parâmetros corretos para o Transaction Pooler do Supabase (PgBouncer)
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/postgres?prepareThreshold=0
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3 # Mantém o pool enxuto para serverless
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update # Não altera o schema no boot para evitar timeouts na Vercel
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

---
# ==========================================
# Profile: DEV (Docker Local)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/euditoria_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
