spring:
  application:
    name: euditoria-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

euditoria:
  security:
    confidentiality-strict: true
    expose-internal-traces: false
  ratelimit:
    enabled: true
    default-requests-per-minute: 120
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
    thread-name-prefix: "EuditoriaTestAsync-"
